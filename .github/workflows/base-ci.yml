name: Base local

on:
  pull_request:
  push: {}

jobs:
  comprobar-base:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: clave-temporal-solo-para-ci
      JWT_SECRET: clave-temporal-de-ci-con-mas-de-treinta-y-dos-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas Python
        run: |
          python -m pip install -e './backend[test,ml]'
          python -m pytest backend/tests/unit backend/tests/integration foodsave-ml/tests -q
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir y arrancar
        run: docker compose up --build -d
      - name: Confirmar migración aplicada al arrancar
        run: docker compose exec -T api alembic current --check-heads
      - name: Verificar metadatos contra PostgreSQL
        run: docker compose exec -T api alembic check
      - name: Verificar volumen de artefactos compartido
        run: |
          docker compose exec -T worker python -c "from pathlib import Path; import os; p = Path(os.environ['MODEL_ARTIFACT_DIR']) / '.ci-probe'; p.write_text('ok'); assert p.read_text() == 'ok'"
          docker compose exec -T api python -c "from pathlib import Path; import os; p = Path(os.environ['MODEL_ARTIFACT_DIR']) / '.ci-probe'; assert p.read_text() == 'ok'"
          docker compose exec -T worker python -c "from pathlib import Path; import os; (Path(os.environ['MODEL_ARTIFACT_DIR']) / '.ci-probe').unlink()"
      - name: Motor A03 e inventario V02 con PostgreSQL y Redis
        run: docker compose run --rm --no-deps --user root -e A03_POSTGRES_TEST=1 -e V02_POSTGRES_TEST=1 api sh -c "pip install -q '.[test]' && python -m pytest tests/integration/test_motor_a03.py tests/integration/test_inventario_concurrencia_pg.py -q"
      - name: Comprobar servicios
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/salud
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/
          docker compose exec -T api python -c "from app.workers.celery_app import tarea_prueba; assert tarea_prueba.delay('ok').get(timeout=15) == {'resultado': 'ok'}"
      - name: Mostrar registros ante fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Detener servicios
        if: always()
        run: docker compose down
