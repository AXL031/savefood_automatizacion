name: Base local

on:
  pull_request:
  push:
    branches: [main, desarrollo]

jobs:
  comprobar-base:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: clave-temporal-solo-para-ci
      JWT_SECRET: clave-temporal-de-ci-con-mas-de-treinta-y-dos-caracteres
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir y arrancar
        run: docker compose up --build -d
      - name: Aplicar migración
        run: docker compose exec -T api alembic upgrade head
      - name: Comprobar servicios
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/salud
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/
          docker compose exec -T api python -c "from app.workers.celery_app import tarea_prueba; assert tarea_prueba.delay('ok').get(timeout=15) == {'resultado': 'ok'}"
      - name: Mostrar registros ante fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Detener servicios
        if: always()
        run: docker compose down
