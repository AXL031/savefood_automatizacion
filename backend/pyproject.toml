[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foodsave-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "celery[redis]>=5.4,<6",
  "tzdata>=2024.1",
  # Requisitos de la primera carga (E02): lectura XLSX y subida multipart.
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.6,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "catboost>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
