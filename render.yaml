# OPCIONAL DE PAGO. No aplicar con presupuesto cero.
# Variante compacta: web/API/worker/Beat en una sola instancia, un disco compartido.
services:
  - type: web
    name: foodsave-integrado
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/operaciones/salud
    numInstances: 1
    autoDeployTrigger: 'off'
    disk:
      name: foodsave-datos
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodsave-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: foodsave-cola
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: HABILITAR_ENLACES_PROVEEDOR
        value: '1'
      - key: HABILITAR_CLIENTE_LOCAL
        value: '1'
      - key: HABILITAR_DATOS_PRUEBA
        value: '1'
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_OPERADOR_PASSWORD
        generateValue: true
      - key: DEMO_CLIENTE_PASSWORD
        generateValue: true
      - key: ML_COMERCIO_ID
        value: piloto
      - key: ML_SUCURSAL_ID
        value: principal
  - type: keyvalue
    name: foodsave-cola
    region: oregon
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: foodsave-postgres
    region: oregon
    plan: 0.1c-256mb
    databaseName: foodsave
    user: foodsave
    ipAllowList: []
