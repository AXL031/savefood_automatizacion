services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodsave
      POSTGRES_USER: foodsave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodsave -d foodsave"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://foodsave:${POSTGRES_PASSWORD}@postgres:5432/foodsave
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://foodsave:${POSTGRES_PASSWORD}@postgres:5432/foodsave
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
